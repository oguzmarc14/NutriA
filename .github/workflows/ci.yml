name: NutriA CI Pipeline

on:
  push:
    branches: [ "automatizacion", "react-mvp", "main" ]
  pull_request:
    branches: [ "automatizacion", "react-mvp", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Obtener el código fuente de tu repositorio
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Node.js en el servidor de GitHub
    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    # 3. Instalar dependencias y verificar el Backend
    - name: Install and Build Backend
      run: |
        cd backend
        npm ci || npm install
        npm run build --if-present

    # 4. Instalar dependencias y verificar la compilación del Frontend (React)
    - name: Install and Build Frontend
      run: |
        cd frontend
        npm ci || npm install
        npm run build