name: 1. CI - Build & Test

on:
  push:
    branches: [ "automatizacion", "react-mvp", "main" ]
  pull_request:
    branches: [ "automatizacion", "react-mvp", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install and Build Backend
      run: |
        cd backend
        npm install
        npm run build --if-present

    - name: Install and Build Frontend
      run: |
        cd frontend
        npm install
        npm run build