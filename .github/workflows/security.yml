name: 2. Security - Dependency Audit

on:
  push:
    branches: [ "automatizacion", "react-mvp", "main" ]
  pull_request:
    branches: [ "automatizacion", "react-mvp", "main" ]
  schedule:
    - cron: '0 0 * * 1' # Se ejecuta automáticamente todos los lunes

jobs:
  audit-dependencies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Audit Backend Packages
      run: |
        cd backend
        npm audit --audit-level=high || true

    - name: Audit Frontend Packages
      run: |
        cd frontend
        npm audit --audit-level=high || true